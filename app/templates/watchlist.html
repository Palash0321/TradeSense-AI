{% extends "base.html" %}

{% block title %}

Watchlist | TradeSense AI

{% endblock %}

{% block css %}

<link rel="stylesheet" href="/static/css/watchlist.css">

{% endblock %}

{% block content %}

<section class="page">

<div class="container">

<div class="section-title">

<h1>

⭐ My Watchlist

</h1>

</div>

<div class="watchlist-toolbar">

    <input
        type="text"
        id="watchlist-search"
        placeholder="🔍 Search stock...">

    <select id="watchlist-sort">

        <option value="default">
            Sort By
        </option>

        <option value="symbol">
            Symbol (A-Z)
        </option>

        <option value="price">
            Price
        </option>

        <option value="change">
            Change %
        </option>

        <option value="score">
            AI Score
        </option>

    </select>

</div>

<div id="watchlist-items">

</div>

</div>

</section>

{% endblock %}

{% block scripts %}

<script src="/static/js/api.js"></script>

<script src="/static/js/watchlist.js"></script>

{% endblock %}
