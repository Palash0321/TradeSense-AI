<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | TradeSense AI</title>

<link rel="stylesheet"
href="/static/css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

background:#0d1117;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

color:white;

}

.card{

width:430px;

background:#161b22;

padding:40px;

border-radius:18px;

box-shadow:0 20px 40px rgba(0,0,0,.45);

}

h1{

text-align:center;

margin-bottom:10px;

}

p{

text-align:center;

margin-bottom:30px;

color:#9ca3af;

}

input{

width:100%;

padding:15px;

margin-bottom:18px;

background:#21262d;

border:none;

border-radius:10px;

color:white;

font-size:15px;

}

button{

width:100%;

padding:15px;

background:#2563eb;

border:none;

border-radius:10px;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.message{

margin-top:20px;

text-align:center;

}

a{

color:#60a5fa;

text-decoration:none;

}

</style>

</head>

<body>

<div class="card">

<h1>Create Account</h1>

<p>Start using TradeSense AI</p>

<form id="registerForm">

<input
id="fullname"
placeholder="Full Name"
required>

<input
id="email"
type="email"
placeholder="Email"
required>

<input
id="password"
type="password"
placeholder="Password"
required>

<button>

Register

</button>

</form>

<div
id="message"
class="message">

</div>

<br>

<div style="text-align:center">

Already have an account?

<a href="/login">

Login

</a>

</div>

</div>

<script>

const form=document.getElementById("registerForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const response=await fetch("/auth/register",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

full_name:

document.getElementById("fullname").value,

email:

document.getElementById("email").value,

password:

document.getElementById("password").value

})

});

const data=await response.json();

if(response.ok){

window.location="/login";

}

else{

document.getElementById("message").innerText=data.detail;

}

});

</script>

</body>

</html>
